  <script type="text/javascript">

    $(document).ready(function () {

      var $document = $(document);
      var selector = '[data-rangeslider]';
      var $element = $(selector);
      var $one = false;

      // For ie8 support
      var textContent = ('textContent' in document) ? 'textContent' : 'innerText';
      // Example functionality to demonstrate a value feedback
      function valueOutput(element) {
        var value = element.value;
        var output = element.parentNode.getElementsByTagName('output')[0] || element.parentNode.parentNode.getElementsByTagName('output')[0];
        //output[textContent] = value;
      }

      // Basic rangeslider initialization
      $element.rangeslider({
        // Deactivate the feature detection
        polyfill: false,
        // Callback function
        onInit: function () {
          valueOutput(this.$element[0]);
        },
        // Callback function
        onSlideEnd: function (position, value) {

          // 이거 이벤트 중복으로 발생하는 버그있음 
          //if ($one == false) {

          //$one = true;

          // writer 페이지 빼기
          if (value != 1) {
            value = value + 2; // 2page viewer : value = value + 2;
          }

          if (currentPage == value) {
            return;
          }

          // 화면 막기
          $('.modal_transparent').show();

          // 로딩 이미지
          $('.loader_wrap').show();

          // 일시 정지    
          $('.audio-player').jPlayer("pause");

          // autoplay 관련 timeout 이벤트가 있을 경우
          // autoplay 재생중 다음페이지 눌렀을때 페이지가 이중으로 넘어가는 현상
          if (typeof myTimeOut != "undefined") {
            clearTimeout(myTimeOut);
          }

          if (value > currentPage) {
            goPage(value, function () {
              $one = false;
            }, 'next');
          } else {
            goPage(value, function () {
              $one = false;
            }, 'prev');
          }

          valueOutput(this.$element[0]);
          //}

        }
      });

      $("body").css({ overflow: 'hidden' }).bind('touchmove', function (e) { e.preventDefault() });

      // 뷰어 프레임 사이즈 조정
      setTimeout(function () {

        init();

      }, 500); // ios 크롬에서 $(window).height() 값이 맞지 않아서 0.5초 텀을 줌              

    });
  </script>
