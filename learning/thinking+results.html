<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0">
  <title>Document</title>


  <script src="../public_html/resource/js/jquery-1.11.1.min.js"></script>
  <script src="../public_html/resource/js/learning.js"></script>
  <link rel="stylesheet" href="../public_html/resource/css/app/common/learning.css">
</head>

<body>
  <div class="wrap thinking results">
    <div class="top">
      <div class="con">
        <div class="btn-wrap">
          <button class="btn btn-icnOnly btn-close">
            <img src="../public_html/resource/images/learning/icn-close-black.svg" alt="back to app">
          </button>
        </div>
      </div>
    </div>
    <div class="contensts">
      <div class="con">
        <div class="inner" name="content">
          <h2 class="results-title">Completed!</h2>
        </div>
        <div class="contents-bottom">
          <button class="btn btn-big btn-done">OK</button>
        </div>
      </div>
    </div>
    <!-- 학습 완료 팝업 (OK 클릭 시 .dimmed 에 act 추가되어 노출) -->
    <div class="dimmed">
      <div class="popup-done">
        <div class="contents-top">
          <h2 class="done-title">Completed!</h2>
          <p class="done-text">Try Activity!</p>
        </div>
        <div class="inner">
          <!-- 다른 학습 바로가기 (링크 추후 매핑) -->
          <ul class="activity-list">
            <li><a href="#" class="btn btn-quiz">Quiz</a></li>
            <li><a href="#" class="btn btn-speaking">Speaking</a></li>
            <li><a href="#" class="btn btn-listening">Listening</a></li>
            <li><a href="#" class="btn btn-thinking">Thinking</a></li>
            <li><a href="#" class="btn btn-bookReport">Book Report</a></li>
          </ul>
          <!-- 추천 도서 -->
          <a href="#" class="recommend">
            <div class="content-thumb">
              <div class="book">
                <img src="../public_html/resource/images/dump/bookimg01.jpg" alt="recommended book">
              </div>
            </div>
            <div class="recommend-text">
              <img src="../public_html/resource/images/learning/img-donePopup.png" alt="#">
              <p>Keep Reading with<br>Highlights!</p>
            </div>
          </a>
        </div>
        <div class="contents-bottom">
          <a href="#" class="btn btn-big">OK</a>
        </div>
      </div>
    </div>
    <!-- 나가기 확인 팝업 (상단 X 클릭 시 .dimmed 에 act 추가되어 노출) -->
    <div class="dimmed">
      <div class="top">
        <div class="con">
          <div class="btn-wrap">
            <button class="btn btn-icnOnly btn-close">
              <img src="../public_html/resource/images/learning/icn-close-white.svg" alt="close">
            </button>
          </div>
        </div>
      </div>
      <div class="popup-exit">
        <h2 class="exit-title">Exit Thinking</h2>
        <p class="exit-text">Are you sure want to exit the Thinking?<br>Your answers will not be saved.</p>
        <div class="btn-wrap">
          <button class="btn btn-no">No</button>
          <a href="#" class="btn btn-ok">Ok</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
