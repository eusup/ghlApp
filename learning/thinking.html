<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0">
  <title>Document</title>

  <script src="../public_html/resource/js/jquery-1.11.1.min.js"></script>
  <script src="../public_html/resource/js/learning.js"></script>
  <link rel="stylesheet" href="../public_html/resource/css/app/common/learning.css">
</head>

<body>
  <div class="wrap thinking startP">
    <div class="top">
      <div class="con">
        <div class="btn-wrap">
          <button class="btn btn-icnOnly btn-close">
            <img src="../public_html/resource/images/learning/icn-close-black.svg" alt="back to app">
          </button>
        </div>
      </div>
    </div>
    <div class="contensts">
      <div class="con">
        <div class="learning-title">
          <img src="../public_html/resource/images/learning/img-title-thinking.svg" alt="Thinking">
        </div>
        <div class="btn-wrap">
          <a class="btn btn-big" href="./thinking+question.html">START</a>
          <div class="alert">
            <span>Click start to begin the activity!</span>
            <img src="../public_html/resource/images/learning/img-speechBubble.svg" alt="#">
          </div>
        </div>
      </div>
    </div>
    <!-- 나가기 확인 팝업 (상단 X 클릭 시 .dimmed 에 act 추가되어 노출) -->
    <div class="dimmed">
      <div class="top">
        <div class="con">
          <div class="btn-wrap">
            <button class="btn btn-icnOnly btn-close">
              <img src="../public_html/resource/images/learning/icn-close-white.svg" alt="close">
            </button>
          </div>
        </div>
      </div>
      <div class="popup-exit">
        <h2 class="exit-title">Exit Thinking</h2>
        <p class="exit-text">Are you sure want to exit the Thinking?<br>Your answers will not be saved.</p>
        <div class="btn-wrap">
          <button class="btn btn-no">No</button>
          <a href="#" class="btn btn-ok">Ok</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
