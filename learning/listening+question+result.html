<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0">
  <title>Document</title>


  <script src="../public_html/resource/js/jquery-1.11.1.min.js"></script>
  <script src="../public_html/resource/js/learning.js"></script>
  <link rel="stylesheet" href="../public_html/resource/css/app/common/learning.css">
</head>

<body>
  <div class="wrap listening question">
    <div class="top">
      <div class="con">
        <div class="btn-wrap">
          <button class="btn btn-icnOnly btn-close">
            <img src="../public_html/resource/images/learning/icn-close-black.svg" alt="back to app">
          </button>
        </div>
      </div>
    </div>
    <div class="contensts">
      <div class="con">
        <div class="contents-top">
          <ul class="step-wrap">
            <li><button class="btn btn-noStyle act">1</button></li>
            <li><button class="btn btn-noStyle">2</button></li>
            <li><button class="btn btn-noStyle">3</button></li>
            <li><button class="btn btn-noStyle">4</button></li>
            <li><button class="btn btn-noStyle">5</button></li>
          </ul>
          <button class="btn btn-noStyle flex questionInfo">
            <img src="../public_html/resource/images/learning/img-question.svg" alt="#">
            <span>Listen to the sentence, then unscramble the words in the sentence!</span>
          </button>
          <!-- 지시문 클릭 시 재생되는 안내 음원 -->
          <audio class="audio-instruction" src="../public_html/resource/files/learning/Readers_Plus_Listening_Instruction.mp3" preload="auto"></audio>
        </div>
        <div class="inner" name="content">
          <div id="container_0" class="act solved" name="container" act_num="0" data-actnum="0" data-answer="A million miles away your signal in the distance">
            <!-- 제출 후 container 첫번째 자식으로 추가됨. 정답일 경우 result non red 가 result pass green, img-wrong.svg 가 img-correct.svg 가 됩니다. -->
            <div class="result non red">
              <img src="../public_html/resource/images/learning/img-wrong.svg" alt="wrong">
              <p>A million miles away your signal in the distance</p>
            </div>
            <div class="question-area">
              <ul class="flex pill-wrap">
                <li>
                  <button id="word_0_0" value="signal" class="btn word">signal</button>
                </li>
                <li>
                  <button id="word_0_1" value="away" class="btn word">away</button>
                </li>
                <li>
                  <button id="word_0_2" value="the" class="btn word">the</button>
                </li>
                <li>
                  <button id="word_0_3" value="A" class="btn word">A</button>
                </li>
                <li>
                  <button id="word_0_4" value="in" class="btn word">in</button>
                </li>
                <li>
                  <button id="word_0_5" value="miles" class="btn word">miles</button>
                </li>
                <li>
                  <button id="word_0_6" value="your" class="btn word">your</button>
                </li>
                <li>
                  <button id="word_0_7" value="distance" class="btn word">distance</button>
                </li>
                <li>
                  <button id="word_0_8" value="million" class="btn word">million</button>
                </li>
              </ul>
            </div>
            <div class="answer-area">
              <ul class="flex pill-wrap">
                <li>
                  <button value="A" class="btn word">A</button>
                </li>
              </ul>
              <button class="btn btn-icnOnly btn-reset">
                <img id="reset_0" src="../public_html/resource/images/learning/icn-reset.svg" alt="reset">
              </button>
            </div>
          </div>
          <div id="container_1" name="container" act_num="1" data-actnum="1" data-answer="A million miles away your signal in the distance">
            <div class="question-area">
              <ul class="flex pill-wrap">
                <li>
                  <button id="word_1_0" value="distance" class="btn word">distance</button>
                </li>
                <li>
                  <button id="word_1_1" value="your" class="btn word">your</button>
                </li>
                <li>
                  <button id="word_1_2" value="A" class="btn word">A</button>
                </li>
                <li>
                  <button id="word_1_3" value="million" class="btn word">million</button>
                </li>
                <li>
                  <button id="word_1_4" value="in" class="btn word">in</button>
                </li>
                <li>
                  <button id="word_1_5" value="away" class="btn word">away</button>
                </li>
                <li>
                  <button id="word_1_6" value="the" class="btn word">the</button>
                </li>
                <li>
                  <button id="word_1_7" value="miles" class="btn word">miles</button>
                </li>
                <li>
                  <button id="word_1_8" value="signal" class="btn word">signal</button>
                </li>
              </ul>
            </div>
            <div class="answer-area">
              <ul class="flex pill-wrap">
                <li>
                  <button value="A" class="btn word">A</button>
                </li>
              </ul>
              <button class="btn btn-icnOnly btn-reset">
                <img id="reset_1" src="../public_html/resource/images/learning/icn-reset.svg" alt="reset">
              </button>
            </div>
          </div>
        </div>
        <div class="contents-bottom">
          <button class="btn btn-icnOnly btn-audio">
            <img src="../public_html/resource/images/learning/icn-headPhone.svg" alt="play">
            <span class="loading"><span></span><span></span><span></span></span>
          </button>
          <button class="btn btn-big act">Submit</button>
          <div id="btn_direction_1" class="btn-wrap">
            <button class="btn btn-icnOnly btn-prev">
              <img src="../public_html/resource/images/learning/icn-arrow.svg" alt="prev">
            </button>
            <button class="btn btn-icnOnly btn-next act">
              <img src="../public_html/resource/images/learning/icn-arrow.svg" alt="next">
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- 나가기 확인 팝업 (상단 X 클릭 시 .dimmed 에 act 추가되어 노출) -->
    <div class="dimmed">
      <div class="top">
        <div class="con">
          <div class="btn-wrap">
            <button class="btn btn-icnOnly btn-close">
              <img src="../public_html/resource/images/learning/icn-close-white.svg" alt="close">
            </button>
          </div>
        </div>
      </div>
      <div class="popup-exit">
        <h2 class="exit-title">Exit Listening</h2>
        <p class="exit-text">Are you sure want to exit the Listening?<br>Your answers will not be saved.</p>
        <div class="btn-wrap">
          <button class="btn btn-no">No</button>
          <a href="#" class="btn btn-ok">Ok</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
