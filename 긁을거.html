  <style>
    @-webkit-keyframes loadingoverlay_animation__rotate_right {
      to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @keyframes loadingoverlay_animation__rotate_right {
      to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @-webkit-keyframes loadingoverlay_animation__rotate_left {
      to {
        -webkit-transform: rotate(-360deg);
        transform: rotate(-360deg);
      }
    }

    @keyframes loadingoverlay_animation__rotate_left {
      to {
        -webkit-transform: rotate(-360deg);
        transform: rotate(-360deg);
      }
    }

    @-webkit-keyframes loadingoverlay_animation__fadein {
      0% {
        opacity: 0;
        -webkit-transform: scale(0.1, 0.1);
        transform: scale(0.1, 0.1);
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        -webkit-transform: scale(1, 1);
        transform: scale(1, 1);
      }
    }

    @keyframes loadingoverlay_animation__fadein {
      0% {
        opacity: 0;
        -webkit-transform: scale(0.1, 0.1);
        transform: scale(0.1, 0.1);
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        -webkit-transform: scale(1, 1);
        transform: scale(1, 1);
      }
    }

    @-webkit-keyframes loadingoverlay_animation__pulse {
      0% {
        -webkit-transform: scale(0, 0);
        transform: scale(0, 0);
      }

      50% {
        -webkit-transform: scale(1, 1);
        transform: scale(1, 1);
      }

      100% {
        -webkit-transform: scale(0, 0);
        transform: scale(0, 0);
      }
    }

    @keyframes loadingoverlay_animation__pulse {
      0% {
        -webkit-transform: scale(0, 0);
        transform: scale(0, 0);
      }

      50% {
        -webkit-transform: scale(1, 1);
        transform: scale(1, 1);
      }

      100% {
        -webkit-transform: scale(0, 0);
        transform: scale(0, 0);
      }
    }
  </style>

<div id="wrap">
  <div id="bg">
    <main class="main" style="display: table-cell;">

              alt="Loading.."> </div>
        </div>
      </section>
    </main>

    <header class="test-header" style="display: none;">
      <div class="test-wrap">
        <div class="time flex qt-wrap">
          <div data-type="question" class="qt">
            <h1>QUESTION</h1>
            <div class="mb-time flex-h-center">
              <h2>5</h2>
              <span>/</span>
              <h3>5</h3>
            </div>
          </div>
        </div>
        <div class="clearfixDiv"></div>
      </div>
      <div class="fake-test-top">
        <div class="test-tl"><img
            src="https://web-cf-cdn.chungchy.com/Highlights_Global_V10/library/public_html/resource/images/leveltest/common/test-tl-bg.png"

        <div class="test-t"></div>
        <div class="test-tr"><img
            src="https://web-cf-cdn.chungchy.com/Highlights_Global_V10/library/public_html/resource/images/leveltest/common/test-tr-bg.png"
            alt=""></div>
      </div>
    </header>

    <input type="hidden" id="sStartLevel" name="sStartLevel" value="1">
    <input type="hidden" id="sStartYear" name="sStartYear" value="2026">
    <input type="hidden" id="sUserLevel" name="sUserLevel" value="3">
    <input type="hidden" id="sGMT" name="sGMT" value="+9">
    <input type="hidden" id="iQuestionCount" name="iQuestionCount" value="5">
    <input type="hidden" id="sAudioYn" name="sAudioYn" value="Y">
    <input type="hidden" id="sQuizArrayKey" name="sQuizArrayKey" value="1">
    <input type="hidden" id="sCurrnetLevel" name="sCurrnetLevel" value="1">


    <main class="test" style="display: none;">
      <section data-name="test-section">
        <div style="">
          <div class="v-list">
            <h1 class="question" style="text-align:center;"> <img
                src="https://web-cf-cdn.chungchy.com/Highlights_Global_V10/library/public_html/resource/images/leveltest/common/pt_audio_icon2.png"
                class="questionAudio" index="5-instruction" style="cursor:pointer;margin-bottom:3px;"> Match the word to
              the correct picture:</h1>
            <h1 class="question" style="text-align:center;"> <img
                src="https://web-cf-cdn.chungchy.com/Highlights_Global_V10/library/public_html/resource/images/leveltest/common/pt_audio_icon2.png"
                class="questionAudio" index="5-questionTitle" style="cursor:pointer;margin-bottom:3px;"> car</h1>
            <ul class="voca01">
              <li class="odd">
                <div> <span>a.</span> <img
                    src="https://content-cf-cdn.chungchy.com/leveltest_global/Level 0/A/T1-5_a.png"
                    alt="Example Image 01"> </div>
              </li>
              <li class="even">
                <div> <span>b.</span> <img
                    src="https://content-cf-cdn.chungchy.com/leveltest_global/Level 0/A/T1-5_b.png"
                    alt="Example Image 02"> </div>
              </li>
              <li class="odd">
                <div> <span>c.</span> <img
                    src="https://content-cf-cdn.chungchy.com/leveltest_global/Level 0/A/T1-5_c.png"
                    alt="Example Image 03"> </div>
              </li>
              <li class="even">
                <div class="focus"> <span>d.</span> <img
                    src="https://content-cf-cdn.chungchy.com/leveltest_global/Level 0/A/T1-5_d.png"
                    alt="Example Image 04"> </div>
              </li>
            </ul>
            <div class="clearfixDiv"></div>
          </div>
          <div class="next-btn"> <a href="#" id="oBtnNext" style=""><img

                alt=""></a> </div>
          <div class="clearfixDiv"></div>
        </div>
      </section>
    </main>
  </div>
